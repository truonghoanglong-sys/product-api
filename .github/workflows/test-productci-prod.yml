name: Product API CI/CD (Production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_REPO: hoanglongdocker1/product-api

jobs:
  # ---------- CI 1: test CRUD voi MongoDB that ----------
  test:
    name: Test CRUD với MongoDB
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:9.0.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/productdb_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------- CI 2: build image + healthcheck + smoke test ----------
  docker-smoke:
    name: Build image và healthcheck
    runs-on: ubuntu-latest
    needs: test

    services:
      mongodb:
        image: mongo:9.0.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t product-api:ci .

      - name: Run container
        run: |
          docker run -d --name product-api --network host \
            -e PORT=3000 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/productdb \
            --health-interval=5s --health-start-period=5s \
            product-api:ci

      - name: Chờ Docker HEALTHCHECK báo healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' product-api)
            echo "Lan $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then echo "Container healthy"; exit 0; fi
            if [ "$STATUS" = "unhealthy" ]; then echo "Container unhealthy"; exit 1; fi
            sleep 5
          done
          echo "Het thoi gian cho healthcheck"
          exit 1

      - name: Kiểm tra /health trả về db connected
        run: |
          RES=$(curl -fs http://127.0.0.1:3000/health)
          echo "$RES"
          echo "$RES" | grep -q '"db":"connected"'

      - name: Smoke test CRUD
        run: |
          set -e
          curl -fs -X POST http://127.0.0.1:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":1,"pname":"Smoke","price":1000,"quantity":1}'; echo
          curl -fs http://127.0.0.1:3000/api/products/1; echo
          curl -fs -X PUT http://127.0.0.1:3000/api/products/1 \
            -H "Content-Type: application/json" -d '{"quantity":5}'; echo
          curl -fs -X DELETE http://127.0.0.1:3000/api/products/1; echo

      - name: In log container khi lỗi
        if: failure()
        run: docker logs product-api

  # ---------- CD: push image len Docker Hub ----------
  push-dockerhub:
    name: Push image lên Docker Hub
    runs-on: ubuntu-latest
    needs: docker-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tạo tag cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=1.0
            type=sha,prefix=sha-

      - name: Build và push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------- CD 2: tu dong deploy len Docker Engine tren laptop ----------
  deploy-local:
    name: Deploy lên Local Docker Engine
    runs-on: [self-hosted, Windows, local-docker]
    needs: push-dockerhub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull image đúng commit và khởi động lại
        run: |
          $env:IMAGE_TAG = "sha-" + "${{ github.sha }}".Substring(0,7)
          Write-Host "Deploy image tag: $env:IMAGE_TAG"
          docker compose -f docker-compose-prod.yaml pull
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose -f docker-compose-prod.yaml up -d
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Chờ container healthy
        run: |
          for ($i = 1; $i -le 24; $i++) {
            $s = docker inspect --format '{{.State.Health.Status}}' product-api-prod
            Write-Host "Lan ${i}: $s"
            if ($s -eq 'healthy') { Write-Host "Container healthy"; exit 0 }
            if ($s -eq 'unhealthy') { docker logs product-api-prod; exit 1 }
            Start-Sleep -Seconds 5
          }
          docker logs product-api-prod
          exit 1

      - name: Kiểm tra /health
        run: |
          $r = Invoke-RestMethod -Uri http://localhost:3001/health
          $r | ConvertTo-Json
          if ($r.db -ne 'connected') { exit 1 }

      - name: Dọn image cũ không dùng
        run: docker image prune -f
