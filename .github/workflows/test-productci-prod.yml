name: Product API CI (Production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test CRUD với MongoDB
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:9
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/productdb_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker-smoke:
    name: Build image và smoke test
    runs-on: ubuntu-latest
    needs: test

    services:
      mongodb:
        image: mongo:9
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t product-api:ci .

      - name: Run container
        run: |
          docker run -d --name product-api --network host \
            -e PORT=3000 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/productdb \
            product-api:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:3000/health; then
              echo; echo "API healthy"; exit 0
            fi
            sleep 3
          done
          echo "API không lên được"
          docker logs product-api
          exit 1