name: Product API CRUD Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-crud:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://admin:admin123@localhost:27017/productdb?authSource=admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start API in background
        run: nohup node server.js > server.log 2>&1 &

      - name: Wait for API to be ready
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:3000/health && break
            echo "Waiting for API..."
            sleep 2
          done

      - name: Test - Create product
        run: |
          curl -sf -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"Test Product","price":100000,"quantity":5}'

      - name: Test - Get all products
        run: curl -sf http://localhost:3000/api/products

      - name: Test - Get product by pid
        run: curl -sf http://localhost:3000/api/products/CI001

      - name: Test - Update product
        run: |
          curl -sf -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{"price":90000,"quantity":3}'

      - name: Test - Delete product
        run: curl -sf -X DELETE http://localhost:3000/api/products/CI001

      - name: Show server log on failure
        if: failure()
        run: cat server.log