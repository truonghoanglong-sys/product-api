name: Deploy to Local Docker Engine

on:
  workflow_run:
    workflows: ["CD - Push to Docker Hub"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show workspace and docker version (debug)
        run: |
          Get-Location
          Get-ChildItem
          docker --version
          docker compose version

      - name: Pull latest image from Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Restart containers with new image
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for containers to be healthy
        run: |
          $healthy = $false
          for ($i = 1; $i -le 15; $i++) {
            $mongoStatus = docker inspect --format='{{.State.Health.Status}}' nammongodb
            $apiStatus = docker inspect --format='{{.State.Health.Status}}' product-api
            Write-Host "mongodb: $mongoStatus | api: $apiStatus"
            if ($mongoStatus -eq "healthy" -and $apiStatus -eq "healthy") {
              Write-Host "Deployment successful, both containers healthy"
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            Write-Host "Containers did not become healthy after deploy"
            docker compose -f docker-compose-prod.yaml logs
            exit 1
          }