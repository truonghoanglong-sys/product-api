name: Deploy to Local Docker Engine

on:
  workflow_run:
    workflows: ["CD - Push to Docker Hub"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Restart containers with new image
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for containers to be healthy
        run: |
          for i in {1..15}; do
            MONGO_STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb)
            API_STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api)
            echo "mongodb: $MONGO_STATUS | api: $API_STATUS"
            if [ "$MONGO_STATUS" = "healthy" ] && [ "$API_STATUS" = "healthy" ]; then
              echo "Deployment successful, both containers healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Containers did not become healthy after deploy"
          docker compose -f docker-compose-prod.yaml logs
          exit 1