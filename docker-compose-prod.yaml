# Chay product-api tu image tren Docker Hub (sau khi CD da push)
# Lenh chay: docker compose -f docker-compose-prod.yaml up -d
name: product-api-prod

services:
  mongodb:
    image: mongo:9.0.2
    container_name: nammongodb-prod
    restart: unless-stopped
    volumes:
      - mongo-data-prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: hoanglongdocker1/product-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: product-api-prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data-prod:
